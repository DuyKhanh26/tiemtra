<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfe3ea">
  <title>Đang tải…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <span class="badge" id="openBadge"><i></i><span>…</span></span>
        <a class="owner-link" href="admin.html">Trang chủ quán</a>
      </div>
      <h1 id="shopName">…</h1>
      <p class="tag" id="tagline"></p>
      <div class="notice hidden" id="notice"></div>
      <div class="infocard">
        <div class="row">📍 <span id="addr"></span></div>
        <div class="row">🕘 <span id="hours"></span></div>
        <div class="row">
          <a class="pill" id="callLink" href="#">📞 Gọi</a>
          <a class="pill z" id="zaloLink" href="#" target="_blank" rel="noopener">Zalo</a>
          <b id="phoneTxt"></b>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="closed-banner hidden" id="closedBanner"></div>
    <nav class="cats" id="cats"></nav>
    <section class="menu" id="menu"></section>
    <footer class="foot" id="foot"></footer>
  </main>

  <div class="cartbar hidden" id="cartBar">
    <button id="openCart"><span><b class="c" id="cartCount">0</b>Xem đơn của bạn</span><span id="cartTotal">0đ</span></button>
  </div>

  <dialog id="cartDlg"><div class="dlg" id="cartBody"></div></dialog>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/notify-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
